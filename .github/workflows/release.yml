name: Build and Release Installer

on:
  # No 'paths:' allowlist on this push trigger, on purpose: nothing here reads
  # a version from a file. A tag push releases under the tag name, and every
  # other push to master republishes the rolling 'latest' prerelease, so any
  # code change is by definition a release.
  # 'paths-ignore' drops the one kind of branch push that is not: a push that
  # touches only documentation starts no run and no runner at all, instead of
  # a guard job that would only answer "nothing to build". The list is the
  # same as the documentation-only pattern in the guard below - keep the two
  # in sync; the guard stays as a second line of defence.
  # GitHub never applies path filters to tag pushes, so a 'v*' tag always
  # starts a run, and 'workflow_dispatch' is not affected either: to rebuild
  # after such a push, use "Run workflow" (with force: true if needed).
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      force:
        description: "Build and publish even if this version is already released"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write  # Required for SignPath
  actions: write   # Lets the build job delete its own SignPath transport artifact once the run has succeeded

# A publishing run is never cancelled halfway. Killing it between signing and
# the release upload would leave a half-published version behind, so overlapping
# runs queue instead of replacing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Guard. Decided once, before anything is built, in a job of its own on a
  # Linux runner: the Windows build job below starts only when this job says
  # build=true, so a run with nothing to release costs one Linux minute instead
  # of warming up a Windows runner billed at 2x. It never blocks on its own
  # uncertainty - anything it cannot determine means "build".
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.guard.outputs.build }}
      slug: ${{ steps.guard.outputs.slug }}

    steps:
    # Needed by the guard itself: 'gh release view' resolves the repository
    # from this checkout, and the push diff below is read from it.
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Version guard
      id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FORCE: ${{ inputs.force }}
        IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        REF_NAME: ${{ github.ref_name }}
        BEFORE_SHA: ${{ github.event.before }}
        CURRENT_SHA: ${{ github.sha }}
      run: |
        decide() {
          echo "build=$1" >> "$GITHUB_OUTPUT"
          echo "guard: build=$1 ($2)"
          exit 0
        }

        # A ref name can contain a slash ("claude/some-branch"). Put straight
        # into a file name it reads as a path into a directory that does not
        # exist, and the copy/rename steps of the build job fail. They use this
        # slug (handed over as a job output) instead. For a tag and for master
        # it is identical to the ref name, so released file names do not
        # change. Written before any decide(), which exits, so it is always set.
        echo "slug=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

        if [ "$FORCE" = "true" ]; then
          decide true "forced manually (force: true)"
        fi

        if [ "$IS_TAG" = "true" ]; then
          # Creating the release is the last step of this job, so a release
          # that already exists for this tag means the version has been built
          # and shipped once already.
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            decide false "release $REF_NAME already exists - re-run with force: true to rebuild it"
          fi
          decide true "new tag $REF_NAME"
        fi

        # Branch push. A push that touched nothing reaching the installer has
        # nothing to build; every other case, and every case this cannot read,
        # builds. The pattern below matches 'paths-ignore' on the trigger, so
        # such a push normally never gets here - this is the fallback.
        if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
          git fetch --no-tags --depth=50 origin "$BEFORE_SHA" >/dev/null 2>&1 || true
          if changed=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" 2>/dev/null) && [ -n "$changed" ]; then
            code=$(echo "$changed" | grep -v -E '(\.md$|^docs/|^\.gitignore$|^\.gitattributes$|^LICENSE$)' || true)
            if [ -z "$code" ]; then
              decide false "documentation-only push"
            fi
          fi
        fi

        decide true "branch push"

  build:
    # Starts only when the guard decided there is something to build, so every
    # step below runs unconditionally on that account.
    needs: guard
    if: ${{ needs.guard.outputs.build == 'true' }}
    runs-on: windows-latest
    # Without this, a hung step - "choco install innosetup", or SignPath with
    # wait-for-completion - runs into the 6 h default, billed at the 2x Windows
    # rate.
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # There is no packages.lock.json in the repository, so "cache: true" on
    # setup-dotnet cannot be used - it fails the job when it finds no lock file
    # to hash. The package folder is cached directly instead, which is what
    # spares a full NuGet restore on a runner billed at 2x.
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Publish .NET App
      run: dotnet publish MirthConnectVersionControl\MirthConnectVersionControl.csproj -c Release -r win-x64 --self-contained false -o MirthConnectVersionControl\bin\Release\net8.0-windows\publish

    - name: Publish Portable Single-File EXE (self-contained)
      run: dotnet publish MirthConnectVersionControl\MirthConnectVersionControl.csproj -c Release

    - name: Copy Portable EXE to workspace root
      shell: pwsh
      run: |
        $src = "MirthConnectVersionControl\bin\Release\net8.0-windows\win-x64\publish\MirthConnectVersionControl.exe"
        if (!(Test-Path $src)) {
          Write-Error "Portable EXE not found at $src"
          Get-ChildItem -Recurse MirthConnectVersionControl\bin\Release\net8.0-windows | Select-Object FullName
          exit 1
        }
        $dest = "MirthConnectVersionControl_Portable_${{ needs.guard.outputs.slug }}_win-x64.exe"
        Copy-Item $src $dest -Force
        Write-Host "Portable EXE copied to $dest"

    - name: Install Inno Setup
      run: choco install innosetup

    - name: Build Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" MCVC.iss
        if ($LASTEXITCODE -ne 0) { 
          Write-Error "ISCC compiler failed with exit code $LASTEXITCODE"
          exit 1 
        }

    - name: Rename Installer
      run: |
        $src = "MirthConnectVersionControl_Setup.exe"
        if (Test-Path $src) {
           $dest = "MirthConnectVersionControl_Setup_${{ needs.guard.outputs.slug }}.exe"
           Move-Item $src $dest
           Write-Host "Successfully generated and renamed to $dest"
        } else {
           Write-Error "Installer file $src was not found after compilation! Checking directory..."
           Get-ChildItem -Recurse
           exit 1
        }

    # SignPath Code Signing (only runs when SIGNPATH_API_TOKEN is configured)
    #
    # This upload is not a copy of the build for people to download - it is how
    # the unsigned installer reaches SignPath, which reads it back by artifact
    # id in the step below. It is kept for that reason alone: the last step of
    # this job deletes it once the run has succeeded, and if the run fails it
    # expires after a day, so it stops counting against Actions storage either
    # way.
    - name: Upload Unsigned Installer for Signing
      if: ${{ env.HAS_SIGNPATH == 'true' }}
      env:
        HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      id: upload-unsigned
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-installer
        path: MirthConnectVersionControl_Setup_*.exe
        retention-days: 1

    - name: Sign Installer with SignPath
      if: ${{ env.HAS_SIGNPATH == 'true' }}
      env:
        HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      id: sign
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
        project-slug: 'mcvc'
        signing-policy-slug: 'release-signing'
        github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: './signed'

    - name: Use Signed Installer
      if: ${{ env.HAS_SIGNPATH == 'true' }}
      env:
        HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      run: |
        # Replace unsigned with signed version
        Remove-Item MirthConnectVersionControl_Setup_*.exe
        Move-Item ./signed/*.exe .
        Write-Host "Using signed installer"

    # A manual run from a branch other than master gets no release - the step
    # below is skipped for it - so without this the run would build both EXEs
    # for 6-10 minutes on a 2x runner and leave nothing behind anywhere. The
    # condition is the exact complement of the release condition, so the same
    # bytes are never stored twice. This artifact IS the product of such a run,
    # so nothing deletes it - but it expires after a day: download it from the
    # run page within 24 hours of the run.
    - name: Upload Installer (manual build with no release)
      if: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/master' }}
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: |
          MirthConnectVersionControl_Setup_*.exe
          MirthConnectVersionControl_Portable_*_win-x64.exe
        retention-days: 1

    # Whenever this step runs, the release is the output of the run. Both EXEs
    # are attached here, so nothing needs to be uploaded as a run artifact as
    # well - the two upload-artifact steps that used to do that carried the
    # same bytes a second time.
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' }}
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        files: |
          MirthConnectVersionControl_Setup_*.exe
          MirthConnectVersionControl_Portable_*_win-x64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Clean-up of the SignPath transport. By this point SignPath has finished
    # (wait-for-completion), the signed installer has been downloaded into
    # './signed' and moved into place, and the release - or the manual
    # artifact above - holds the output, so 'unsigned-installer' has no further
    # use and is deleted now rather than sitting in Actions storage for a day.
    # - success() only: if anything failed, it stays for its one day, for
    #   inspection and "Re-run failed jobs".
    # - Only this artifact, selected by name: the 'installer' artifact of a
    #   manual build is the product of that run and must stay.
    # - continue-on-error: a failed clean-up must never turn a published
    #   release red.
    # - The 'actions: write' permission this needs is granted at the top of
    #   the file.
    - name: Delete this run's SignPath transport artifact
      if: ${{ success() && steps.upload-unsigned.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
          --jq '.artifacts[] | select(.name == "unsigned-installer") | .id' \
          | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
